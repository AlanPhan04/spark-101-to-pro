# book-genesis — single source of truth for this project.
project_slug: spark-query-optimization-book
title_working: "Spark Query Optimization and the Iceberg Lakehouse"
language: en

manuscript_path: "book/"            # the LaTeX source IS the manuscript
manuscript_format: latex            # not the skill default (manuscript/chapters/*.md)
figures_dir: "book/figures/"
images_dir: "book/images/"

phase: "3-drafting"                 # 0-intake -> 1-foundation -> 2-architecture -> 3-drafting -> ...
gate: PASS                          # re-scaffold done, first figure rendered, book builds clean (70 pp skeleton)

scope_contract:
  positioning: deep-dive            # reference / tutorial / deep-dive / handbook
  chapter_count_planned: 19
  parts_planned: 5
  pages_planned: 380
  code_density: heavy
  reference_environment:
    spark: "3.5.2"
    iceberg: "v2 (format version 2)"
    # Kyuubi, Hive Metastore, GCS, GKE were removed from the book's scope (author's decision, Oct 2026);
    # the lab is a single local-mode container with a file-based Iceberg catalog.
    cluster_manager: "Kubernetes (executors as pods; not exercised in the lab)"
    jvm: "17"
    file_format: "Apache Parquet"

quality_target: 8.5                 # triggers the Phase 5 Clarity Barrier loop

phases_done:
  - "0-intake"
  - "1-foundation"
  - "2-architecture (outline v1)"
  - "re-scaffold: 19 chapters + 5 appendices + front matter, book class, builds clean"

# Chapter list is authoritative in artifacts/06-outline.md; per-chapter drafting
# status tracked here as chapters are written.
chapters:
  - {n: 1, slug: shape-of-a-spark-application, status: drafted}   # full draft, 3 figures
  - {n: 2, slug: sql-to-execution,             status: drafted}   # full draft, 1 figure + explain listing
  - {n: 3, slug: executor-memory-and-cpu,      status: drafted}   # full draft, 2 figures
  - {n: 4, slug: the-shuffle,                  status: drafted}   # full draft, 2 figures
  - {n: 6, slug: adaptive-query-execution,     status: deepened}  # 3 figs, 8 listings (plans marked % CAPTURE), 7 tables; ~3.1k words; errata fixed (64 MB advisory, parallelismFirst formula)
  - {n: 7, slug: partitioning-bucketing-pruning, status: deepened}  # 3 figs (dpp-flow redrawn, pruning-static, bucketed-join), 5 listings (plans % CAPTURE), 6 tables
  - {n: 12, slug: reading-iceberg-efficiently, status: deepened}  # 3 figs, measured scan counters, lookups on 4 table layouts, adaptive split size finding
  - {n: 8, slug: caching-and-reuse, status: deepened}  # 5 figs, break-even sweep, lazy/eager, levels, eviction, reuse, LRU thrash (all measured)
  - {n: 9, slug: table-formats-and-the-iceberg-spec, status: deepened}  # 5 figs; measured tree, reuse, sequence numbers, CoW vs MoR delete; spec rule corrected (position deletes: <=)
  - {n: 10, slug: catalogs-and-commits, status: deepened}  # 4 figs; 12-writer race measured (attempts, failures, no lost rows); invented v42/v43 example removed
  - {n: 11, slug: iceberg-partitioning-and-layout, status: deepened}  # 6 figs; granularity, evolution cost, identity trap, sort vs zorder, distribution modes, hot bucket (all measured)
  - {n: 13, slug: writing-and-maintaining-iceberg, status: deepened}  # 6 figs; CoW vs MoR updates, MERGE predicate, metadata delete, compaction, manifests, expire, orphans (all measured); invented 40M-row skew example removed
  # 5, 14-19: drafted thin (see lint_chapter.py --status)

figures:                            # shared renderer: figures/_drawio.py
  - {slug: application-topology,   chapter: 1, status: rendered}
  - {slug: query-submission-flow,  chapter: 1, status: rendered}
  - {slug: job-stage-task,         chapter: 1, status: rendered}
  - {slug: narrow-vs-wide,         chapter: 1, status: rendered}
  - {slug: catalyst-pipeline,      chapter: 2, status: rendered}
  - {slug: executor-memory-model,  chapter: 3, status: rendered}
  - {slug: gc-pause-stall,         chapter: 3, status: rendered}
  - {slug: shuffle-write-read-path, chapter: 4, status: rendered}
  - {slug: partition-sizing,        chapter: 4, status: rendered}  # plain matplotlib, exact formula (not a drawio box diagram)

