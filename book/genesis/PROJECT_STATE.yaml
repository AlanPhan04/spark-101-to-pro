# book-genesis — single source of truth for this project.
project_slug: spark-query-optimization-book
title_working: "Spark Query Optimization and the Iceberg Lakehouse"
language: en

manuscript_path: "book/"            # the LaTeX source IS the manuscript
manuscript_format: latex            # not the skill default (manuscript/chapters/*.md)
figures_dir: "book/figures/"
images_dir: "book/images/"

